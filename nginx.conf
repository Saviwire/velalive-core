server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve sitemap.xml directly with the correct XML format
    location = /sitemap.xml {
        try_files $uri =404;
        add_header Content-Type application/xml;
    }

    # Serve robots.txt directly with the correct text format
    location = /robots.txt {
        try_files $uri =404;
        add_header Content-Type text/plain;
    }

    # Catch-all for React Router (Handles all your site's pages)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
